name: Static Application Security Testing
# on: pull_request
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install bandit
      # scan python codes by Bandit
      - run: bandit -r .