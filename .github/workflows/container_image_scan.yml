name: Container image scan
on: pull_request
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # run Trivy
      - uses: aquasecurity/trivy-action@0.19.0
        with:
          # scan target image
          image-ref: nginx:1.11.0
          # Importance of the target image
          severity: CRITICAL,HIGH
          # return 1 if trouble is found
          exit-code: 1