name: Fail-fast disable matrix
on: push
jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      # disable matrix fail fast
      fail-fast: false
      matrix:
        # sleep each process at a different time
        time: [10, 20, 30]
    steps:
      - run: sleep "${SLEEP_TIME}" && exit 1
        env:
          SLEEP_TIME: ${{ matrix.time }}