name: Parallel jobs
# on: push
on: workflow_dispatch
# declare multiple jobs
jobs:
  first:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 10 && echo "First job"

  second:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 10 && echo "Second job"

  third:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 10 && echo "Third job"