version: 2
updates:
  - package-ecosystem: github-actions
    # deployment directory of package manifest
    directory: /
    # version up schedule
    schedule:
      interval: daily
    # exclusion settings
    ignore:
      - dependency-name: actions/upload-artifact
        versions:
          - 4.3.0
          - 4.3.1
      - dependency-name: "actions/*"
        update-types:
          - version-update:semver-major
          
